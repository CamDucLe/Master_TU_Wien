name: Validate team.toml

on:
  push:
    paths:
      - "team.toml"
  pull_request:
    paths:
      - "team.toml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate team.toml
        run: python validate_team.py
